name: Publish AUR package

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      pkgrel:
        default: '1'
        type: string
      dry_run:
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: Release version, with or without the leading v
        required: true
        type: string
      pkgrel:
        description: Arch package release number
        required: true
        default: '1'
        type: string
      dry_run:
        description: Build and stage the AUR update without committing or pushing
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: aur-publish
  cancel-in-progress: false

jobs:
  prepare:
    name: Build and prepare AUR review
    runs-on: ubuntu-24.04
    container: archlinux:base-devel

    steps:
      - name: Install packaging dependencies
        run: |
          pacman --sync --refresh --sysupgrade --noconfirm
          pacman --sync --needed --noconfirm cmake curl git libmicrohttpd liquid-dsp namcap openssh rtl-sdr

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create unprivileged package builder
        run: |
          useradd --create-home --user-group builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build and export review files
        env:
          PUBLISH_TAG: ${{ inputs.version }}
          PUBLISH_PKGREL: ${{ inputs.pkgrel }}
        run: |
          runuser --preserve-environment --user builder -- \
            bash "$GITHUB_WORKSPACE/scripts/publish-aur.sh" \
            --version "$PUBLISH_TAG" --pkgrel "$PUBLISH_PKGREL" \
            --repository "$GITHUB_REPOSITORY" --prepare "$GITHUB_WORKSPACE/aur-review"
          cat aur-review/review.md >> "$GITHUB_STEP_SUMMARY"
          tar -czf aur-review.tar.gz -C aur-review .

      - name: Upload package and review files
        id: review
        uses: actions/upload-artifact@v4
        with:
          name: aur-review
          path: aur-review.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Link review download
        env:
          REVIEW_URL: ${{ steps.review.outputs.artifact-url }}
          REVIEW_DIGEST: ${{ steps.review.outputs.artifact-digest }}
        run: |
          printf '\n[Download the review artifact](%s)\n\nArtifact SHA256: %s\n' \
            "$REVIEW_URL" "$REVIEW_DIGEST" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Approve and publish AUR package
    needs: prepare
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    environment:
      name: aur-publish
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download reviewed package files
        uses: actions/download-artifact@v4
        with:
          name: aur-review
          path: prepared

      - name: Extract review files
        run: tar -xzf prepared/aur-review.tar.gz -C prepared

      - name: Publish reviewed AUR files
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_GIT_AUTHOR_NAME: ${{ vars.AUR_GIT_AUTHOR_NAME }}
          AUR_GIT_AUTHOR_EMAIL: ${{ vars.AUR_GIT_AUTHOR_EMAIL }}
          PUBLISH_TAG: ${{ inputs.version }}
          PUBLISH_PKGREL: ${{ inputs.pkgrel }}
        run: |
          bash scripts/publish-aur.sh \
            --version "$PUBLISH_TAG" --pkgrel "$PUBLISH_PKGREL" \
            --repository "$GITHUB_REPOSITORY" --publish "$GITHUB_WORKSPACE/prepared"
