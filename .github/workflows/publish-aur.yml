name: Publish AUR package

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: Release version, with or without the leading v
        required: true
        type: string
      pkgrel:
        description: Arch package release number
        required: true
        default: '1'
        type: string
      dry_run:
        description: Build and stage the AUR update without committing or pushing
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: aur-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Render and publish AUR package
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'aur-dry-run' || 'aur-publish' }}

    steps:
      - name: Install packaging dependencies
        run: |
          pacman --sync --refresh --sysupgrade --noconfirm
          pacman --sync --needed --noconfirm cmake curl git libmicrohttpd liquid-dsp namcap openssh rtl-sdr

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create unprivileged package builder
        run: |
          useradd --create-home --user-group builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Render, validate, and publish
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_GIT_AUTHOR_NAME: ${{ vars.AUR_GIT_AUTHOR_NAME }}
          AUR_GIT_AUTHOR_EMAIL: ${{ vars.AUR_GIT_AUTHOR_EMAIL }}
          PUBLISH_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}
          PUBLISH_PKGREL: ${{ github.event_name == 'workflow_dispatch' && inputs.pkgrel || '1' }}
          PUBLISH_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          args=(--version "$PUBLISH_TAG" --pkgrel "$PUBLISH_PKGREL" --repository "$GITHUB_REPOSITORY")
          if [ "$PUBLISH_DRY_RUN" = true ]; then
            args+=(--dry-run)
          fi

          runuser --preserve-environment --user builder -- \
            bash "$GITHUB_WORKSPACE/scripts/publish-aur.sh" "${args[@]}"
